name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: lint-typecheck-test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Black check
        run: black --check --line-length=100 .

      - name: Mypy
        run: mypy pinak --config-file pyproject.toml

      - name: Pytest with coverage
        run: pytest --cov=pinak --cov-report=term-missing --cov-fail-under=75

  security:
    name: security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e .

      - name: Bandit (static security, fail on MEDIUM+)
        # Remaining low findings are benign idioms (no-shell subprocess,
        # best-effort try/except); medium+ are triaged with `# nosec`.
        run: bandit -r pinak -x tests -q -ll

      - name: pip-audit (dependency CVEs)
        run: pip-audit

      - name: SBOM (CycloneDX)
        run: |
          pip install -e ".[dev]"
          cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: cli/sbom.json

  gitleaks:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
