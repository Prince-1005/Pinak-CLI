name: CI

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: lint-typecheck-test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-mcp-lock.txt
          pip install --no-deps -e ".[mcp]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Black check
        run: black --check --line-length=100 .

      - name: Mypy
        run: mypy pinak --config-file pyproject.toml

      - name: Pytest with coverage
        shell: bash
        run: |
          pytest --cov=pinak --cov-report=term-missing --cov-fail-under=75
      - name: Measure local MCP performance
        run: python tools/benchmark_mcp.py --output benchmark-results/mcp.json
      - name: Upload MCP timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-timings-${{ matrix.os }}-py${{ matrix.python }}
          path: cli/benchmark-results/mcp.json
  security:
    name: security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-mcp-lock.txt
          pip install --no-deps -e ".[mcp]"

      - name: Bandit (static security, fail on MEDIUM+)
        # Remaining low findings are benign idioms (no-shell subprocess,
        # best-effort try/except); medium+ are triaged with `# nosec`.
        run: bandit -r pinak -x tests -q -ll

      - name: pip-audit (dependency CVEs)
        run: pip-audit --local --skip-editable

      - name: SBOM (CycloneDX)
        run: |
          cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: cli/sbom.json

  gitleaks:
    name: secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Verify secret detection with a synthetic canary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-canary"
          python3 -c "from pathlib import Path; import os, secrets, string; token = 'ghp_' + ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)); Path(os.environ['RUNNER_TEMP'], 'gitleaks-canary', 'test.txt').write_text('token = ' + token)"
          if "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/gitleaks-canary" --config .gitleaks.toml --redact --no-banner; then
            echo "::error::Secret detector missed its synthetic canary"
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi

      - name: Scan Git history on every caller event
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner'

  installation:
    name: clean Linux package and container installation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux playback prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 python3-tk
      - name: Build and verify a clean installation
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m build --outdir release-dist
          python -m twine check --strict release-dist/*
          python tools/smoke_wheel.py release-dist --check-playback-imports --check-mcp
      - name: Verify pre-MCP upgrade and compatible core downgrade
        run: |
          git fetch --no-tags --depth=1 origin 73de91e766a8073afe356521534ca2239fe7c488
          git -C .. archive --format=zip --output "$RUNNER_TEMP/pinak-pre-mcp.zip" 73de91e766a8073afe356521534ca2239fe7c488 cli
          python -c "import os, zipfile; from pathlib import Path; root = Path(os.environ['RUNNER_TEMP']); zipfile.ZipFile(root / 'pinak-pre-mcp.zip').extractall(root / 'pinak-pre-mcp')"
          python -m build "$RUNNER_TEMP/pinak-pre-mcp/cli" --wheel --outdir "$RUNNER_TEMP/pinak-pre-mcp-wheels"
          python -c "import os, subprocess, sys; from pathlib import Path; old = next((Path(os.environ['RUNNER_TEMP']) / 'pinak-pre-mcp-wheels').glob('*.whl')); new = next(Path('release-dist').glob('*.whl')); subprocess.run([sys.executable, 'tools/smoke_mcp_upgrade.py', '--legacy-wheel', str(old), '--current-wheel', str(new)], check=True)"
      - name: Verify container installation
        run: |
          docker build --tag pinak-install-check .
          docker run --rm pinak-install-check --version
          docker run --rm pinak-install-check --help
      - name: Prepare repository-free Pinak-MCP download
        run: python tools/package_mcp.py release-dist --output mcp-install --source-revision "$GITHUB_SHA"
      - name: Upload Pinak-MCP installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: pinak-mcp-install
          path: cli/mcp-install/
          if-no-files-found: error
          retention-days: 90
      - name: Prepare self-hosted cloud installer
        run: python tools/package_cloud.py release-dist --output cloud-install --source-revision "$GITHUB_SHA"
      - name: Build cloud deployment image
        run: docker build --tag pinak-cloud-check cloud-install
      - name: Verify cloud image and persistent storage
        shell: bash
        run: |
          docker run --rm --entrypoint python pinak-cloud-check -c 'import os; import pinak.mcp_cloud.app'
          docker run --detach --name pinak-cloud-check --publish 127.0.0.1:18000:8000 --volume pinak-cloud-check:/data --env PINAK_CLOUD_URL=http://127.0.0.1:18000 --env PINAK_CLOUD_TEST_LOOPBACK=1 pinak-cloud-check
          python tools/smoke_cloud_container.py --container pinak-cloud-check --url http://127.0.0.1:18000
      - name: Clean cloud test container
        if: always()
        run: docker rm --force pinak-cloud-check || true
      - name: Upload self-hosted cloud installer
        uses: actions/upload-artifact@v4
        with:
          name: pinak-mcp-cloud-install
          path: cli/cloud-install/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
