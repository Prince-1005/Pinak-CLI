name: Release Please

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Prefer a fine-grained PAT/App token so release-please can open PRs
          # even when "Allow GitHub Actions to create and approve pull requests"
          # is disabled for GITHUB_TOKEN in repository settings.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
