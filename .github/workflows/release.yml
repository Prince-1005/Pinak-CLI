name: Automatic release creation disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-status:
    runs-on: ubuntu-latest
    steps:
      - name: Manual releases only
        run: |
          echo "::notice::Automatic release creation is disabled. Create GitHub releases manually."
          echo "::notice::Publishing a release or manually running publish.yml invokes the verified PyPI publishing workflow."
