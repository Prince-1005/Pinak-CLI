name: Website
on:
  push:
    paths: ['Website/**', 'cli/pyproject.toml', 'cli/CHANGELOG.md', '.github/workflows/website.yml']
  pull_request:
    paths: ['Website/**', 'cli/pyproject.toml', 'cli/CHANGELOG.md', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: Website/.cache/media
          key: media-v4-${{ runner.os }}-${{ hashFiles('Website/Media/**', 'Website/media.json', 'Website/scripts/media.mjs') }}
          restore-keys: media-v4-${{ runner.os }}-
      - run: npm test
      - run: npm run media:build && npm run check
      - name: Build under the repository Pages path
        run: npm run build
        env:
          SITE_URL: ${{ vars.WEBSITE_SITE_URL }}
          BASE_PATH: ${{ vars.WEBSITE_BASE_PATH }}
      - name: Save Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website/dist
      - name: Build root-path browser fixture
        run: npm run build
        env:
          BASE_PATH: '/'
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-results
          path: Website/test-results/

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static output
        id: deployment
        uses: actions/deploy-pages@v4
